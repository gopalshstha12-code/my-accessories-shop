<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Accessories Store (Buyer View)</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
    .header { text-align: center; background: linear-gradient(135deg, #ff5722, #ff7043); color: white; padding: 30px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header h1 { margin: 0 0 10px 0; font-size: 28px; }
    .header p { margin: 0; font-size: 14px; opacity: 0.9; }
    .filter-container { max-width: 1200px; margin: 0 auto 20px auto; display: flex; gap: 10px; }
    select { padding: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; background: white; width: 220px; cursor: pointer; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eef0f2; transition: 0.3s; position: relative; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
    .img-container { text-align: center; margin-bottom: 12px; background: #fcfcfc; border-radius: 8px; padding: 5px; }
    .product-img { max-width: 100%; height: 180px; object-fit: contain; border-radius: 6px; }
    .no-img { height: 180px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; border-radius: 6px; }
    .title { font-size: 16px; font-weight: bold; color: #222; margin: 0 0 8px 0; line-height: 1.4; height: 44px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .meta-tags { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
    .badge { padding: 3px 8px; font-size: 11px; font-weight: bold; color: white; border-radius: 4px; }
    .bg-cat { background-color: #007bff; }
    .bg-warn { background-color: #6f42c1; }
    .bg-stock { background-color: #28a745; }
    .bg-out { background-color: #dc3545; }
    .price-section { margin: 10px 0; font-size: 14px; }
    .old-price { text-decoration: line-through; color: #888; margin-right: 8px; }
    .new-price { color: #d32f2f; font-weight: bold; font-size: 18px; }
    .desc { font-size: 12px; color: #666; margin: 0 0 15px 0; height: 50px; overflow-y: auto; background: #f9f9f9; padding: 6px; border-radius: 4px; line-height: 1.4; }
    .order-btn { display: block; text-align: center; background-color: #ff5722; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .order-btn:hover { background-color: #e64a19; }
    .no-products { text-align: center; grid-column: 1 / -1; color: #888; font-size: 16px; padding: 50px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 Online Mobile Accessories Store</h1>
    <p>Premium Quality Accessories at Best Prices • Select items and contact us to buy!</p>
  </div>

  <div class="filter-container">
    <select id="categoryFilter">
      <option value="all">🛍️ Show All Categories</option>
    </select>
  </div>

  <div class="catalog" id="catalog">
    <div class="no-products">Loading shop items...</div>
  </div>

  <script>
    const catalogContainer = document.getElementById('catalog');
    const categoryFilter = document.getElementById('categoryFilter');
    let allProducts = [];

    // सिधै आफ्नै फोल्डरको products.json बाट डाटा तान्ने (तपाईंको आफ्नै रिपोजिटरी पाथ)
    async function fetchProducts() {
      try {
        // यहाँ सापेक्षित मार्ग (Relative Path) राखिएको छ ताकि गिटहब पेजेजले सजिलै चिनोस्
        const response = await fetch('products.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("फाइल भेटिएन");
        
        allProducts = await response.json();
        
        setupFilters();
        displayProducts(allProducts);
      } catch (error) {
        console.error("Error loading products:", error);
        catalogContainer.innerHTML = '<div class="no-products">⚠️ No items available in store right now.</div>';
      }
    }

    function setupFilters() {
      const categories = new Set();
      allProducts.forEach(p => { if(p.category) categories.add(p.category); });
      
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        categoryFilter.appendChild(opt);
      });
    }

    function displayProducts(productsToRender) {
      catalogContainer.innerHTML = '';
      
      if (!productsToRender || productsToRender.length === 0) {
        catalogContainer.innerHTML = '<div class="no-products">No items available in this category.</div>';
        return;
      }

      productsToRender.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'card';

        const imgHtml = prod.image 
          ? `<div class="img-container"><img src="${prod.image}" class="product-img" alt="${prod.name}"></div>`
          : `<div class="no-img">📷 No Image Available</div>`;

        const stockBadge = parseInt(prod.stock) > 0 
          ? `<span class="badge bg-stock">Stock: ${prod.stock}</span>`
          : `<span class="badge bg-out">Out of Stock</span>`;

        card.innerHTML = `
          <div>
            ${imgHtml}
            <h3 class="title">${prod.name}</h3>
            <div class="meta-tags">
              <span class="badge bg-cat">${prod.category || 'General'}</span>
              <span class="badge bg-warn">${prod.warranty || 'No Warranty'}</span>
              ${stockBadge}
            </div>
            <p style="margin:0 0 8px 0; font-size:12px; color:#77px;">Brand: <b>${prod.brand || 'Non-Brand'}</b></p>
            <div class="price-section">
              <span class="old-price">Rs. ${prod.price}</span>
              <span class="new-price">Rs. ${prod.specialPrice}</span>
            </div>
            <div class="desc">${prod.description || 'No description provided.'}</div>
          </div>
          <a href="https://wa.me/97798XXXXXXXX?text=Hi, I want to buy ${encodeURIComponent(prod.name)}" target="_blank" class="order-btn">💬 Order via WhatsApp</a>
        `;
        catalogContainer.appendChild(card);
      });
    }

    categoryFilter.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (selected === 'all') {
        displayProducts(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === selected);
        displayProducts(filtered);
      }
    });

    // लोड गर्ने
    fetchProducts();
  </script>
</body>
</html>
